# Global configuration for NotProton Discord Rich Presence.
# Changes take effect on the next game launch (no Steam restart needed).
# Per-game Steam UI options and Launch Options (DISCORD_RPC_*) always override these settings.

# Presence mode: auto, fallback, or native_only
mode = auto

# Artwork style: cover (600x900), header, hero, logo, or icon
artwork = cover

# Subtitle shown under the game name. Leave empty (subtitle =) to hide it.
subtitle = Steam via NotProton

# Optional custom directory for discord-ipc-0
# socket_dir =

# Optional custom Discord Application ID for fallback presence
# client_id =

# Optional small badge image (URL or Discord asset key). Leave empty for no badge.
# Recommended: 512x512 px square PNG (1:1), centered with ~15-20% padding (Discord crops to a circle).
small_image =

# Optional custom large artwork override (URL or Discord asset key). Leave empty for auto Steam art.
large_image_override =


