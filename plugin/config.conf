# Global configuration for NotProton Discord Rich Presence.
# Changes take effect on the next game launch (no Steam restart needed).
# Per-game Steam Launch Options (NOTPROTON_DISCORD_*) always override these settings.

# Subtitle shown under the game name. Leave empty (state =) to hide it.
state = Steam via NotProton

# Artwork style: cover (600x900), header, hero, logo, or icon
art = cover

# Set to 1 to skip the Win32 pipe helper and start Steam presence immediately
force_auto = 0

# Set to 1 to relay native game RPC pipes only (disables Steam fallback presence)
disable_auto = 0

# Seconds to wait for native game RPC before falling back (0-60)
wait_sec = 3

# Optional custom directory for discord-ipc-0
# socket_dir =
