# NotProton Discord Rich Presence Plugin
# Bridges Win32 named pipes (\\.\pipe\discord-ipc-0) from Windows games to macOS Discord client.

[NOTPROTON_DISCORD_BRIDGE]
label          = Discord Rich Presence
description    = Bridges Windows game Discord Rich Presence to macOS Discord client.
description_on = Active: Win32 named pipe \\.\pipe\discord-ipc-0 is bridged to host Discord IPC socket.
section        = dev
on             = 1
inject         = 1
requires       = Library/Application Support/notproton/plugins/discord-rpc/discord_bridge.dylib
