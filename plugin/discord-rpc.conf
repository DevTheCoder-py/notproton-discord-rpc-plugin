# NotProton Discord Rich Presence Plugin
# Bridges Win32 named pipes (\\.\pipe\discord-ipc-0..9) from Windows games to macOS Discord client.

[NOTPROTON_DISCORD_BRIDGE]
label          = Discord Rich Presence
description    = Bridges Windows game Discord Rich Presence to macOS Discord client.
description_on = Active: Win32 named pipe \\.\pipe\discord-ipc-0 is bridged to host Discord IPC socket.
section        = dev
on             = 1
inject         = 1
requires       = Library/Application Support/notproton/plugins/discord-rpc/discord_bridge.dylib

[NOTPROTON_ENV_DISCORD_RPC_MODE]
label       = Presence mode
description = Auto waits 3s for native game RPC before Steam fallback; Fallback only skips the Win32 pipe helper.
type        = choice
depends     = NOTPROTON_DISCORD_BRIDGE
choice      = auto = Auto (Native + Steam fallback)
choice      = fallback = Steam fallback only
choice      = native_only = Native game RPC only

[NOTPROTON_ENV_DISCORD_RPC_ARTWORK]
label       = Cover art style
description = Artwork displayed in Discord when Steam fallback presence is active.
type        = choice
depends     = NOTPROTON_DISCORD_BRIDGE
choice      = cover = Box art (600x900)
choice      = header = Store banner
choice      = hero = Wide background
choice      = logo = Title logo
choice      = icon = Classic icon (32x32)
