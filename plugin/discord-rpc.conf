[NOTPROTON_DISCORD_BRIDGE]
label          = Discord Rich Presence
description    = Enables Discord Rich Presence for Windows games via SDK or a beautiful fallback method.
section        = dev
on             = 1
inject         = 1
requires       = Library/Application Support/notproton/plugins/discord-rpc/discord_bridge.dylib

[NOTPROTON_ENV_DISCORD_RPC_MODE]
label       = Presence mode
description = Choose how Discord Rich Presence is detected and handled.
type        = choice
depends     = NOTPROTON_DISCORD_BRIDGE
choice      = auto = Auto (Native + Steam fallback)
choice      = fallback = Steam fallback only
choice      = native_only = Native game RPC only

[NOTPROTON_ENV_DISCORD_RPC_ARTWORK]
label       = Cover art style
description = Select the artwork displayed in Discord when using Steam fallback.
type        = choice
depends     = NOTPROTON_DISCORD_BRIDGE
choice      = cover = Box art (600×900)
choice      = header = Store banner
choice      = hero = Wide background
choice      = logo = Title logo
choice      = icon = Classic icon (32×32)
