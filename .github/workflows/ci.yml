name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install mingw-w64

      - name: Build all components
        run: |
          make clean && make all

      - name: Run test suite
        run: |
          make check

      - name: Package release artifact & compute checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-pkg/discord-rpc
          cp plugin/discord-rpc.conf release-pkg/
          cp build/discord_bridge.dylib release-pkg/discord-rpc/
          cp build/notproton-discord.exe release-pkg/discord-rpc/
          cp install.sh README.md release-pkg/
          (cd release-pkg && zip -r ../notproton-discord-rpc-plugin.zip .)
          
          # Generate SHA-256 checksums for individual binaries and the release archive
          shasum -a 256 build/discord_bridge.dylib build/notproton-discord.exe notproton-discord-rpc-plugin.zip > SHA256SUMS.txt
          
          # Generate release notes body
          cat <<EOF > release_notes.md
          ## Release ${{ github.ref_name }}

          Pre-built universal binaries compiled directly on clean GitHub Actions runner (\`macos-14\`).

          ### SHA-256 Checksums
          \`\`\`text
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            notproton-discord-rpc-plugin.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
