name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install mingw-w64

      - name: Build all components
        run: |
          make all

      - name: Run test suite
        run: |
          make check

      - name: Package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-pkg/discord-rpc
          cp plugin/discord-rpc.conf release-pkg/
          cp build/discord_bridge.dylib release-pkg/discord-rpc/
          cp build/notproton-discord.exe release-pkg/discord-rpc/
          cp install.sh README.md release-pkg/
          cd release-pkg && zip -r ../notproton-discord-rpc-plugin.zip .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: notproton-discord-rpc-plugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
